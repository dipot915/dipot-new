<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dipot Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg:#0E1020; --surface:#171A2E; --surface-2:#1F2340; --border:#2A2F52;
    --text:#EDEEF7; --text-muted:#9298B8; --accent:#7C6CF6; --accent-2:#35D0C0;
    --price:#FFB648; --danger:#FF6B6B; --success:#35D0C0; --radius:12px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{background:var(--bg); color:var(--text); font-family:'Manrope',sans-serif;}
  h1,h2,h3,.logo{font-family:'Space Grotesk',sans-serif;}
  input,select,textarea,button{font-family:inherit;}
  button{cursor:pointer;}
  .hidden{display:none !important;}

  /* ---- Login ---- */
  #loginScreen{min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px;}
  .login-box{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:36px; width:100%; max-width:380px;}
  .logo{font-size:24px; font-weight:700; margin-bottom:6px;}
  .logo span{color:var(--accent-2);}
  .login-box p.sub{color:var(--text-muted); font-size:14px; margin-bottom:24px;}
  .field{margin-bottom:16px;}
  .field label{display:block; font-size:13px; color:var(--text-muted); margin-bottom:6px;}
  .field input, .field select, .field textarea{
    width:100%; background:var(--surface-2); border:1px solid var(--border); color:var(--text);
    padding:11px 14px; border-radius:8px; font-size:14px;
  }
  .btn{
    background:var(--accent); color:#fff; border:none; padding:12px 20px; border-radius:8px;
    font-weight:700; font-size:14px; width:100%;
  }
  .btn-outline{background:transparent; border:1px solid var(--border); color:var(--text);}
  .btn-danger{background:var(--danger); color:#1a0505;}
  .link-btn{background:none; border:none; color:var(--accent-2); font-size:13px; text-decoration:underline;}
  #loginError{color:var(--danger); font-size:13px; margin-top:10px;}

  /* ---- App shell ---- */
  #app{display:grid; grid-template-columns:220px 1fr; min-height:100vh;}
  aside{background:var(--surface); border-right:1px solid var(--border); padding:24px 16px; display:flex; flex-direction:column;}
  aside .logo{padding:0 8px 24px;}
  nav a{display:block; padding:11px 12px; border-radius:8px; color:var(--text-muted); font-size:14px; font-weight:600; margin-bottom:4px; cursor:pointer;}
  nav a.active, nav a:hover{background:var(--surface-2); color:var(--text);}
  aside .bottom{margin-top:auto;}
  main{padding:28px 32px; max-width:1100px;}
  .page{display:none;}
  .page.active{display:block;}
  .page-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:24px; flex-wrap:wrap; gap:12px;}
  .page-head h1{font-size:24px;}

  .stat-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:16px; margin-bottom:32px;}
  .stat-card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:20px;}
  .stat-card b{font-size:28px; display:block; font-family:'Space Grotesk';}
  .stat-card span{font-size:13px; color:var(--text-muted);}

  .toolbar{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:18px;}
  .toolbar input, .toolbar select{
    background:var(--surface); border:1px solid var(--border); color:var(--text);
    padding:9px 12px; border-radius:8px; font-size:13px;
  }

  table{width:100%; border-collapse:collapse; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); overflow:hidden;}
  th,td{padding:12px 14px; text-align:left; font-size:13.5px; border-bottom:1px solid var(--border);}
  th{color:var(--text-muted); font-weight:600; font-size:12px; text-transform:uppercase; letter-spacing:0.03em;}
  tr:last-child td{border-bottom:none;}
  .thumb{width:36px; height:36px; border-radius:8px; object-fit:cover; background:var(--surface-2);}
  .pill{display:inline-block; padding:3px 10px; border-radius:999px; font-size:11.5px; font-weight:700;}
  .pill-on{background:rgba(53,208,192,0.15); color:var(--accent-2);}
  .pill-off{background:rgba(255,107,107,0.15); color:var(--danger);}
  .pill-featured{background:rgba(255,182,72,0.15); color:var(--price);}
  .row-actions{display:flex; gap:6px; flex-wrap:wrap;}
  .row-actions button{
    background:var(--surface-2); border:1px solid var(--border); color:var(--text);
    padding:6px 10px; border-radius:6px; font-size:12px;
  }
  .row-actions button.danger{color:var(--danger); border-color:rgba(255,107,107,0.3);}

  /* modal */
  .modal-overlay{position:fixed; inset:0; background:rgba(0,0,0,0.6); display:flex; align-items:center; justify-content:center; z-index:100; padding:20px;}
  .modal{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:28px; width:100%; max-width:560px; max-height:88vh; overflow-y:auto;}
  .modal h2{margin-bottom:18px; font-size:19px;}
  .grid-2{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
  .feature-row{display:flex; gap:8px; margin-bottom:8px;}
  .feature-row input{flex:1;}
  .feature-row button{background:var(--surface-2); border:1px solid var(--border); color:var(--danger); padding:0 12px; border-radius:6px;}
  .toggle-row{display:flex; gap:20px; margin:14px 0;}
  .toggle-row label{display:flex; align-items:center; gap:8px; font-size:13.5px; color:var(--text-muted);}
  .modal-actions{display:flex; gap:10px; margin-top:20px;}
  .img-preview{width:80px; height:80px; border-radius:10px; object-fit:cover; background:var(--surface-2); margin-bottom:10px;}

  .toast{position:fixed; bottom:24px; right:24px; background:var(--surface); border:1px solid var(--border); padding:14px 20px; border-radius:10px; font-size:14px; z-index:200; box-shadow:0 12px 30px -8px rgba(0,0,0,0.5);}
  .toast.error{border-color:var(--danger); color:var(--danger);}
  .toast.success{border-color:var(--accent-2); color:var(--accent-2);}
  .empty{color:var(--text-muted); font-size:14px; padding:24px; text-align:center;}
</style>
</head>
<body>

<!-- ============ LOGIN ============ -->
<div id="loginScreen">
  <div class="login-box">
    <div class="logo">Dipot<span>.</span> Admin</div>
    <p class="sub">Sign in to manage products and categories.</p>
    <div class="field"><label>Email</label><input type="email" id="loginEmail" autocomplete="username"></div>
    <div class="field"><label>Password</label><input type="password" id="loginPassword" autocomplete="current-password"></div>
    <button class="btn" id="loginBtn">Log in</button>
    <div id="loginError"></div>
    <div style="text-align:center; margin-top:16px;">
      <button class="link-btn" id="forgotBtn">Forgot password?</button>
    </div>
  </div>
</div>

<!-- ============ APP ============ -->
<div id="app" class="hidden">
  <aside>
    <div class="logo">Dipot<span>.</span></div>
    <nav>
      <a data-page="dashboard" class="active">Dashboard</a>
      <a data-page="products">Products</a>
      <a data-page="categories">Categories</a>
      <a data-page="account">Account</a>
    </nav>
    <div class="bottom">
      <button class="btn btn-outline" id="logoutBtn">Logout</button>
    </div>
  </aside>
  <main>

    <!-- Dashboard -->
    <section class="page active" id="page-dashboard">
      <div class="page-head"><h1>Dashboard</h1></div>
      <div class="stat-grid" id="statGrid"></div>
      <h3 style="margin-bottom:12px;">Recently updated products</h3>
      <table><tbody id="recentTable"></tbody></table>
    </section>

    <!-- Products -->
    <section class="page" id="page-products">
      <div class="page-head">
        <h1>Products</h1>
        <button class="btn" style="width:auto;" id="addProductBtn">+ Add Product</button>
      </div>
      <div class="toolbar">
        <input type="text" id="searchProducts" placeholder="Search products...">
        <select id="filterCategory"><option value="">All categories</option></select>
        <select id="filterStatus"><option value="">All status</option><option value="active">Active</option><option value="inactive">Inactive</option></select>
        <select id="filterFeatured"><option value="">All</option><option value="yes">Featured</option><option value="no">Not featured</option></select>
      </div>
      <table>
        <thead><tr><th></th><th>Name</th><th>Category</th><th>Price</th><th>Status</th><th>Featured</th><th></th></tr></thead>
        <tbody id="productsTable"></tbody>
      </table>
    </section>

    <!-- Categories -->
    <section class="page" id="page-categories">
      <div class="page-head">
        <h1>Categories</h1>
        <button class="btn" style="width:auto;" id="addCategoryBtn">+ Add Category</button>
      </div>
      <table>
        <thead><tr><th>Name</th><th>Slug</th><th>Status</th><th>Order</th><th></th></tr></thead>
        <tbody id="categoriesTable"></tbody>
      </table>
    </section>

    <!-- Account -->
    <section class="page" id="page-account">
      <div class="page-head"><h1>Account</h1></div>
      <div style="max-width:420px;">
        <div class="field"><label>Email</label><input type="text" id="accEmail" disabled></div>
        <div class="field"><label>Full name</label><input type="text" id="accName"></div>
        <div class="field"><label>Role</label><input type="text" id="accRole" disabled></div>
        <button class="btn" id="saveNameBtn" style="width:auto;">Save name</button>
        <hr style="border-color:var(--border); margin:24px 0;">
        <div class="field"><label>New password</label><input type="password" id="newPassword"></div>
        <button class="btn btn-outline" id="changePasswordBtn" style="width:auto;">Change password</button>
      </div>
    </section>

  </main>
</div>

<script>
/* ============================================================
   CONFIG — from your Supabase project settings
   ============================================================ */
const SUPABASE_URL = "https://weuiojthjzbsgwivfmiv.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_tqNLg9hnr3OrZw2nUT8hTA_oisfQ6Hi";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let currentProfile = null;
let categoriesCache = [];
let productsCache = [];

function toast(msg, type=""){
  const t = document.createElement("div");
  t.className = "toast " + type;
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(), 3500);
}
function slugify(s){ return s.toLowerCase().trim().replace(/[^a-z0-9]+/g,"-").replace(/(^-|-$)/g,""); }
function fmtDate(d){ return new Date(d).toLocaleDateString("en-GB",{day:"2-digit",month:"short",year:"numeric"}); }

/* ---------------- AUTH ---------------- */
async function checkSession(){
  const { data:{ session } } = await sb.auth.getSession();
  if(session){ await afterLogin(); } else { showLogin(); }
}

function showLogin(){
  document.getElementById("loginScreen").classList.remove("hidden");
  document.getElementById("app").classList.add("hidden");
}

async function afterLogin(){
  const { data:{ user } } = await sb.auth.getUser();
  if(!user){ showLogin(); return; }
  const { data:profile, error } = await sb.from("profiles").select("*").eq("id", user.id).single();
  if(error || !profile || !["owner","admin","editor"].includes(profile.role)){
    await sb.auth.signOut();
    document.getElementById("loginError").textContent = "This account is not authorized for admin access.";
    showLogin();
    return;
  }
  currentProfile = profile;
  document.getElementById("loginScreen").classList.add("hidden");
  document.getElementById("app").classList.remove("hidden");
  document.getElementById("accEmail").value = profile.email || "";
  document.getElementById("accName").value = profile.full_name || "";
  document.getElementById("accRole").value = profile.role;
  loadAll();
}

document.getElementById("loginBtn").onclick = async ()=>{
  const email = document.getElementById("loginEmail").value.trim();
  const password = document.getElementById("loginPassword").value;
  document.getElementById("loginError").textContent = "";
  if(!email || !password){ document.getElementById("loginError").textContent = "Enter email and password."; return; }
  const { error } = await sb.auth.signInWithPassword({ email, password });
  if(error){ document.getElementById("loginError").textContent = error.message; return; }
  afterLogin();
};

document.getElementById("forgotBtn").onclick = async ()=>{
  const email = document.getElementById("loginEmail").value.trim();
  if(!email){ document.getElementById("loginError").textContent = "Enter your email above first, then click Forgot password."; return; }
  const { error } = await sb.auth.resetPasswordForEmail(email);
  if(error){ toast(error.message, "error"); } else { toast("Password reset email sent.", "success"); }
};

document.getElementById("logoutBtn").onclick = async ()=>{
  await sb.auth.signOut();
  location.reload();
};

/* ---------------- NAV ---------------- */
document.querySelectorAll("nav a").forEach(a=>{
  a.onclick = ()=>{
    document.querySelectorAll("nav a").forEach(x=>x.classList.remove("active"));
    document.querySelectorAll(".page").forEach(x=>x.classList.remove("active"));
    a.classList.add("active");
    document.getElementById("page-"+a.dataset.page).classList.add("active");
  };
});

/* ---------------- LOAD DATA ---------------- */
async function loadAll(){
  await loadCategories();
  await loadProducts();
  renderDashboard();
  renderProducts();
  renderCategories();
  populateCategoryFilter();
}

async function loadCategories(){
  const { data, error } = await sb.from("categories").select("*").order("sort_order");
  if(error){ toast(error.message,"error"); return; }
  categoriesCache = data || [];
}
async function loadProducts(){
  const { data, error } = await sb.from("products").select("*, categories(name)").order("sort_order");
  if(error){ toast(error.message,"error"); return; }
  productsCache = data || [];
}

function renderDashboard(){
  const total = productsCache.length;
  const active = productsCache.filter(p=>p.is_active).length;
  const inactive = total - active;
  const featured = productsCache.filter(p=>p.is_featured).length;
  const stats = [
    ["Total Products", total], ["Active", active], ["Inactive", inactive],
    ["Featured", featured], ["Categories", categoriesCache.length]
  ];
  document.getElementById("statGrid").innerHTML = stats.map(s=>`<div class="stat-card"><b>${s[1]}</b><span>${s[0]}</span></div>`).join("");
  const recent = [...productsCache].sort((a,b)=> new Date(b.updated_at)-new Date(a.updated_at)).slice(0,5);
  document.getElementById("recentTable").innerHTML = recent.map(p=>`<tr><td>${p.name}</td><td>${fmtDate(p.updated_at)}</td></tr>`).join("") || `<tr><td class="empty">No products yet</td></tr>`;
}

function populateCategoryFilter(){
  const sel = document.getElementById("filterCategory");
  sel.innerHTML = `<option value="">All categories</option>` + categoriesCache.map(c=>`<option value="${c.id}">${c.name}</option>`).join("");
}

/* ---------------- PRODUCTS TABLE ---------------- */
function renderProducts(){
  const search = document.getElementById("searchProducts").value.toLowerCase();
  const catF = document.getElementById("filterCategory").value;
  const statusF = document.getElementById("filterStatus").value;
  const featF = document.getElementById("filterFeatured").value;

  let list = productsCache.filter(p=>{
    if(search && !p.name.toLowerCase().includes(search)) return false;
    if(catF && p.category_id !== catF) return false;
    if(statusF === "active" && !p.is_active) return false;
    if(statusF === "inactive" && p.is_active) return false;
    if(featF === "yes" && !p.is_featured) return false;
    if(featF === "no" && p.is_featured) return false;
    return true;
  });

  if(list.length === 0){
    document.getElementById("productsTable").innerHTML = `<tr><td colspan="7" class="empty">No products found</td></tr>`;
    return;
  }

  document.getElementById("productsTable").innerHTML = list.map(p=>`
    <tr>
      <td>${p.image_url ? `<img class="thumb" src="${p.image_url}">` : `<div class="thumb"></div>`}</td>
      <td>${p.name}</td>
      <td>${p.categories ? p.categories.name : "—"}</td>
      <td>Rs ${Number(p.price||0).toLocaleString()}</td>
      <td><span class="pill ${p.is_active?'pill-on':'pill-off'}">${p.is_active?'Active':'Inactive'}</span></td>
      <td>${p.is_featured ? '<span class="pill pill-featured">Featured</span>' : '—'}</td>
      <td>
        <div class="row-actions">
          <button onclick="editProduct('${p.id}')">Edit</button>
          <button onclick="toggleField('products','${p.id}','is_active',${!p.is_active})">${p.is_active?'Deactivate':'Activate'}</button>
          <button onclick="toggleField('products','${p.id}','is_featured',${!p.is_featured})">${p.is_featured?'Unfeature':'Feature'}</button>
          <button class="danger" onclick="deleteProduct('${p.id}')">Delete</button>
        </div>
      </td>
    </tr>
  `).join("");
}
["searchProducts","filterCategory","filterStatus","filterFeatured"].forEach(id=>{
  document.getElementById(id).addEventListener("input", renderProducts);
  document.getElementById(id).addEventListener("change", renderProducts);
});

async function toggleField(table, id, field, value){
  const { error } = await sb.from(table).update({ [field]: value }).eq("id", id);
  if(error){ toast(error.message,"error"); return; }
  toast("Updated.", "success");
  await loadAll();
}

async function deleteProduct(id){
  if(!confirm("Are you sure you want to permanently delete this product?")) return;
  const { error } = await sb.from("products").delete().eq("id", id);
  if(error){ toast(error.message,"error"); return; }
  toast("Product deleted.", "success");
  await loadAll();
}

/* ---------------- PRODUCT MODAL ---------------- */
let editingProductId = null;
let featureList = [];
let pendingImageFile = null;

function openProductModal(product){
  editingProductId = product ? product.id : null;
  featureList = product && product.features ? [...product.features] : [];
  pendingImageFile = null;

  const overlay = document.createElement("div");
  overlay.className = "modal-overlay";
  overlay.id = "productModalOverlay";
  overlay.innerHTML = `
    <div class="modal">
      <h2>${product ? "Edit product" : "Add product"}</h2>
      ${product && product.image_url ? `<img class="img-preview" src="${product.image_url}">` : ""}
      <div class="field"><label>Product image</label><input type="file" id="pImageFile" accept="image/*"></div>
      <div class="field"><label>Name</label><input type="text" id="pName" value="${product?product.name:''}"></div>
      <div class="field"><label>Slug</label><input type="text" id="pSlug" value="${product?product.slug:''}"></div>
      <div class="field"><label>Description</label><textarea id="pDesc" rows="2">${product?product.description||'':''}</textarea></div>
      <div class="grid-2">
        <div class="field"><label>Category</label><select id="pCategory">${categoriesCache.map(c=>`<option value="${c.id}" ${product&&product.category_id===c.id?'selected':''}>${c.name}</option>`).join("")}</select></div>
        <div class="field"><label>Price (PKR)</label><input type="number" id="pPrice" value="${product?product.price:''}"></div>
        <div class="field"><label>Old price</label><input type="number" id="pOldPrice" value="${product?product.old_price||'':''}"></div>
        <div class="field"><label>Discount %</label><input type="number" id="pDiscount" value="${product?product.discount||'':''}"></div>
      </div>
      <div class="field"><label>Custom WhatsApp message (optional)</label><input type="text" id="pWaMsg" value="${product?product.whatsapp_message||'':''}" placeholder="Hi, I'm interested in ..."></div>
      <div class="field">
        <label>Features</label>
        <div id="featureRows"></div>
        <button class="link-btn" id="addFeatureBtn" type="button">+ Add feature</button>
      </div>
      <div class="toggle-row">
        <label><input type="checkbox" id="pFeatured" ${product&&product.is_featured?'checked':''}> Featured</label>
        <label><input type="checkbox" id="pActive" ${!product||product.is_active?'checked':''}> Active</label>
      </div>
      <div class="field"><label>Sort order</label><input type="number" id="pSort" value="${product?product.sort_order||0:0}"></div>
      <div class="modal-actions">
        <button class="btn" id="saveProductBtn">Save</button>
        <button class="btn btn-outline" id="cancelProductBtn">Cancel</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
  renderFeatureRows();
  document.getElementById("addFeatureBtn").onclick = ()=>{ featureList.push(""); renderFeatureRows(); };
  document.getElementById("pImageFile").onchange = (e)=>{ pendingImageFile = e.target.files[0]; };
  document.getElementById("cancelProductBtn").onclick = ()=> overlay.remove();
  document.getElementById("pName").oninput = (e)=>{ if(!product) document.getElementById("pSlug").value = slugify(e.target.value); };
  document.getElementById("saveProductBtn").onclick = saveProduct;
}
function renderFeatureRows(){
  document.getElementById("featureRows").innerHTML = featureList.map((f,i)=>`
    <div class="feature-row">
      <input type="text" value="${f}" onchange="featureList[${i}]=this.value">
      <button type="button" onclick="featureList.splice(${i},1); renderFeatureRows();">✕</button>
    </div>
  `).join("");
}

async function saveProduct(){
  const payload = {
    name: document.getElementById("pName").value.trim(),
    slug: document.getElementById("pSlug").value.trim() || slugify(document.getElementById("pName").value),
    description: document.getElementById("pDesc").value.trim(),
    category_id: document.getElementById("pCategory").value,
    price: parseFloat(document.getElementById("pPrice").value) || 0,
    old_price: document.getElementById("pOldPrice").value ? parseFloat(document.getElementById("pOldPrice").value) : null,
    discount: document.getElementById("pDiscount").value ? parseFloat(document.getElementById("pDiscount").value) : null,
    whatsapp_message: document.getElementById("pWaMsg").value.trim() || null,
    features: featureList.filter(f=>f.trim()!==""),
    is_featured: document.getElementById("pFeatured").checked,
    is_active: document.getElementById("pActive").checked,
    sort_order: parseInt(document.getElementById("pSort").value) || 0
  };
  if(!payload.name || !payload.slug || !payload.category_id){
    toast("Name, slug and category are required.", "error"); return;
  }

  if(pendingImageFile){
    const ext = pendingImageFile.name.split(".").pop();
    const path = `${payload.slug}-${Date.now()}.${ext}`;
    const { error: upErr } = await sb.storage.from("product-images").upload(path, pendingImageFile, { upsert:true });
    if(upErr){ toast("Image upload failed: "+upErr.message, "error"); return; }
    const { data: pub } = sb.storage.from("product-images").getPublicUrl(path);
    payload.image_url = pub.publicUrl;
  }

  let error;
  if(editingProductId){
    ({ error } = await sb.from("products").update(payload).eq("id", editingProductId));
  } else {
    ({ error } = await sb.from("products").insert(payload));
  }
  if(error){ toast(error.message, "error"); return; }
  toast("Product saved.", "success");
  document.getElementById("productModalOverlay").remove();
  await loadAll();
}

function editProduct(id){
  const p = productsCache.find(x=>x.id===id);
  openProductModal(p);
}
document.getElementById("addProductBtn").onclick = ()=> openProductModal(null);

/* ---------------- CATEGORIES ---------------- */
function renderCategories(){
  if(categoriesCache.length===0){
    document.getElementById("categoriesTable").innerHTML = `<tr><td colspan="5" class="empty">No categories yet</td></tr>`;
    return;
  }
  document.getElementById("categoriesTable").innerHTML = categoriesCache.map(c=>`
    <tr>
      <td>${c.name}</td>
      <td>${c.slug}</td>
      <td><span class="pill ${c.is_active?'pill-on':'pill-off'}">${c.is_active?'Active':'Inactive'}</span></td>
      <td>${c.sort_order}</td>
      <td>
        <div class="row-actions">
          <button onclick="editCategory('${c.id}')">Edit</button>
          <button onclick="toggleField('categories','${c.id}','is_active',${!c.is_active})">${c.is_active?'Deactivate':'Activate'}</button>
          <button class="danger" onclick="deleteCategory('${c.id}')">Delete</button>
        </div>
      </td>
    </tr>
  `).join("");
}

function openCategoryModal(cat){
  const overlay = document.createElement("div");
  overlay.className = "modal-overlay";
  overlay.id = "catModalOverlay";
  overlay.innerHTML = `
    <div class="modal" style="max-width:420px;">
      <h2>${cat ? "Edit category" : "Add category"}</h2>
      <div class="field"><label>Name</label><input type="text" id="cName" value="${cat?cat.name:''}"></div>
      <div class="field"><label>Slug</label><input type="text" id="cSlug" value="${cat?cat.slug:''}"></div>
      <div class="field"><label>Description</label><input type="text" id="cDesc" value="${cat?cat.description||'':''}"></div>
      <div class="field"><label>Sort order</label><input type="number" id="cSort" value="${cat?cat.sort_order||0:0}"></div>
      <div class="modal-actions">
        <button class="btn" id="saveCatBtn">Save</button>
        <button class="btn btn-outline" id="cancelCatBtn">Cancel</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
  document.getElementById("cName").oninput = (e)=>{ if(!cat) document.getElementById("cSlug").value = slugify(e.target.value); };
  document.getElementById("cancelCatBtn").onclick = ()=> overlay.remove();
  document.getElementById("saveCatBtn").onclick = async ()=>{
    const payload = {
      name: document.getElementById("cName").value.trim(),
      slug: document.getElementById("cSlug").value.trim() || slugify(document.getElementById("cName").value),
      description: document.getElementById("cDesc").value.trim(),
      sort_order: parseInt(document.getElementById("cSort").value) || 0
    };
    if(!payload.name){ toast("Name is required.", "error"); return; }
    let error;
    if(cat){ ({error} = await sb.from("categories").update(payload).eq("id", cat.id)); }
    else{ ({error} = await sb.from("categories").insert(payload)); }
    if(error){ toast(error.message, "error"); return; }
    toast("Category saved.", "success");
    overlay.remove();
    await loadAll();
  };
}
function editCategory(id){ openCategoryModal(categoriesCache.find(c=>c.id===id)); }
document.getElementById("addCategoryBtn").onclick = ()=> openCategoryModal(null);

async function deleteCategory(id){
  const inUse = productsCache.some(p=>p.category_id===id);
  if(inUse){ toast("Reassign or delete products in this category first.", "error"); return; }
  if(!confirm("Delete this category permanently?")) return;
  const { error } = await sb.from("categories").delete().eq("id", id);
  if(error){ toast(error.message,"error"); return; }
  toast("Category deleted.", "success");
  await loadAll();
}

/* ---------------- ACCOUNT ---------------- */
document.getElementById("saveNameBtn").onclick = async ()=>{
  const full_name = document.getElementById("accName").value.trim();
  const { error } = await sb.from("profiles").update({ full_name }).eq("id", currentProfile.id);
  if(error){ toast(error.message,"error"); return; }
  toast("Name updated.", "success");
};
document.getElementById("changePasswordBtn").onclick = async ()=>{
  const password = document.getElementById("newPassword").value;
  if(password.length < 6){ toast("Password must be at least 6 characters.", "error"); return; }
  const { error } = await sb.auth.updateUser({ password });
  if(error){ toast(error.message,"error"); return; }
  toast("Password changed.", "success");
  document.getElementById("newPassword").value = "";
};

checkSession();
</script>
